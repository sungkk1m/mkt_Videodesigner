# GitHub Pages deployment for the static editor.
#
# LICENSE NOTE: this workflow used to be manual-only, on the reading that any
# deployment needed Remotion commercial-use approval first. §6 of
# docs/03-analysis/browser-video-mvp.remotion-license-review.md revised that:
# deploying in order to evaluate the tool stays inside the Free License
# evaluation clause, and §7 lists deployment as explicitly *not* a trigger. The
# trigger that does matter is using a rendered MP4 in a live or paid campaign —
# buy a Company License before that, regardless of how this file is configured.
#
# Docs-only commits are skipped: the PDCA cycle pushes a lot of markdown, and
# none of it changes the built app.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.bkit/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ci.yml runs these too, but it runs *beside* this workflow rather than
      # before it. Now that a push deploys on its own, the gate has to live on
      # the path that publishes: a red suite must not reach the live URL.
      - name: Unit tests
        run: npm test

      # `base: './'` in vite.config.ts keeps every asset, worker, and font URL
      # relative, so the app also works from a repository subpath. Design §8.4 #9.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
